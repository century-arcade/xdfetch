[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdfetch"
dynamic = ["version"]
description = "Fetch crossword puzzles from online outlets and convert them to .xd"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alex DeJarnatt" }]
keywords = ["crossword", "puzzles", "xd", "downloader"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/century-arcade/xdfetch"
Repository = "https://github.com/century-arcade/xdfetch"
Issues = "https://github.com/century-arcade/xdfetch/issues"

[project.scripts]
xdfetch = "xdfetch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.version]
path = "xdfetch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["xdfetch"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
