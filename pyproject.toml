[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdfetch"
dynamic = ["version"]
description = "Download crossword puzzles and convert them to .xd"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Alex DeJarnatt" }]
keywords = ["crossword", "puzzles", "xd", "downloader"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "requests>=2.32",
    "tzdata>=2024.1",
    "xdformat[convert]>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/century-arcade/xdfetch"
Repository = "https://github.com/century-arcade/xdfetch"
Issues = "https://github.com/century-arcade/xdfetch/issues"

[project.scripts]
xdfetch = "xdfetch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.26.3",
    "ruff>=0.8",
    "ty>=0.0.100",
]

[tool.hatch.version]
path = "xdfetch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["xdfetch"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = [
    "ignore:invalid escape sequence:DeprecationWarning",  # from the ipuz package
]
